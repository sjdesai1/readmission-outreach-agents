name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:                      # real database for the integration tests
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_DB_HOST: localhost
      POSTGRES_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install (exact versions from uv.lock)
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Tests with coverage (unit + Postgres integration)
        run: uv run pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Validate docker-compose file
        run: cp .env.example .env && docker compose config --quiet

      # report-only for now: tracked in an issue and tightened over time
      - name: Type check (report only)
        continue-on-error: true
        run: uv run pyright

      - name: Dependency audit (report only)
        continue-on-error: true
        run: |
          uv export --frozen --no-hashes --no-emit-project > requirements-locked.txt
          uvx pip-audit -r requirements-locked.txt --no-deps --disable-pip
