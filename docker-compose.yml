# Local stack for the readmission outreach project.
# Start everything:  docker compose up -d --build
# Stop:              docker compose down        (keeps data)
# Wipe everything:   docker compose down -v     (deletes databases)

x-mcp: &mcp                  # settings shared by every MCP server
  image: readmission-outreach-agents-app
  pull_policy: never         # built locally by mcp-patient-data, never pulled from a registry
  depends_on:
    postgres:
      condition: service_healthy
  env_file: .env
  environment:
    APP_DB_HOST: postgres
    SMTP_HOST: mailpit
  volumes:
    - .:/opt/project

services:

  # One Postgres for everything. Separate databases: airflow, mlflow, app.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Airflow in standalone mode: api server, scheduler, dag processor and triggerer
  # in one container. Production splits these into separate services.
  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      args:
        AIRFLOW_VERSION: ${AIRFLOW_VERSION}
    command: standalone
    user: "${AIRFLOW_UID}:0"
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # no login screen, local only
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      # inside Docker, services are reached by service name, not localhost
      APP_DB_HOST: postgres
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SMTP_HOST: mailpit
      MAILPIT_API_URL: http://mailpit:8025
      GRAFANA_URL: http://grafana:3000
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/project
      - airflow_logs:/opt/airflow/logs

  # Experiment tracking + model registry. Metadata in Postgres, model files in a volume.
  mlflow:
    build:
      context: docker/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  # Catches every email the agents send. Open http://localhost:8025 to read them.
  mailpit:
    image: ${MAILPIT_IMAGE}
    ports:
      - "8025:8025"   # web inbox
      - "1025:1025"   # SMTP

  # ---- MCP servers: the agents' only doors into the outreach system (one container each) ----
  mcp-patient-data:
    <<: *mcp
    build:                   # only this service builds the image; the other four reuse it
      context: .
      dockerfile: docker/app/Dockerfile
    command: python -m readmit.mcp.patient_data
    ports:
      - "8101:8101"

  mcp-scheduling:
    <<: *mcp
    command: python -m readmit.mcp.scheduling
    ports:
      - "8102:8102"

  mcp-messaging:
    <<: *mcp
    command: python -m readmit.mcp.messaging
    ports:
      - "8103:8103"

  mcp-referrals:
    <<: *mcp
    command: python -m readmit.mcp.referrals
    ports:
      - "8104:8104"

  mcp-cases:
    <<: *mcp
    command: python -m readmit.mcp.cases
    ports:
      - "8105:8105"

  # Dashboard and alerts over the app database: http://localhost:3000 (no login locally).
  # Dashboard, data source and alert rules are provisioned from docker/grafana: edit the files, not the UI.
  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:11.6.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}          # read by the data source provisioning file
      GF_AUTH_ANONYMOUS_ENABLED: "true"                # local only, like Airflow's no-login setting
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/outreach.json
      GF_SMTP_ENABLED: "true"                          # alert emails land in Mailpit
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@orchardvalley.example
      GF_SMTP_SKIP_VERIFY: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  pgdata:
  airflow_logs:
  mlflow_artifacts:
  grafana_data:
