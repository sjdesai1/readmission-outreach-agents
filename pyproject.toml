[project]
name = "readmit"
version = "0.1.0"
description = "Synthetic end-to-end readmission risk model + multi-agent patient outreach"
requires-python = ">=3.11,<3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.17.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }   # one source of truth for deps

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:authlib.jose module is deprecated"]   # pytest resets filters per module, so it needs its own

[tool.uv]
# dependencies live in requirements.txt; tell uv to re-read them when that file changes
cache-keys = [{ file = "pyproject.toml" }, { file = "requirements.txt" }]
